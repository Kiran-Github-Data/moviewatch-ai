# Fly.io config for the MovieWatch orchestrator API.
# Deploy from the repo root: fly deploy

app = "moviewatch-api"
primary_region = "dfw"

[build]
  dockerfile = "apps/orchestrator-api/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "5s"

# Runs prisma migrate deploy before each release (no-ops when already applied).
[deploy]
  release_command = "pnpm --filter @moviewatch/database exec prisma migrate deploy"

# Monitoring worker (Milestone 5): checks ARMED watches every 15 min and
# auto-books when authorized. Runs as a separate machine without public ports.
# Agent worker (Milestone 6): LangGraph deep agent — LLM-powered preference
# matching with code-gated purchases. Idles when ANTHROPIC_API_KEY is unset.
[processes]
  app = "pnpm --filter @moviewatch/orchestrator-api exec tsx src/index.ts"
  worker = "pnpm --filter @moviewatch/orchestrator-api exec tsx src/worker.ts"
  agent_worker = "pnpm --filter @moviewatch/orchestrator-api exec tsx src/agent/scheduler.ts"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NODE_ENV = "production"
  PORT = "8080"
